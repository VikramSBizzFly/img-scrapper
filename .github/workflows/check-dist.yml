name: check-dist

# dist/ is committed so `npm install -g git+https://...` needs no build step.
# This fails when someone changes src/ without running `npm run release`.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run clean && npm run build
      - name: dist/ must match a fresh build
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo "::error::dist/ is out of date. Run 'npm run release' and commit the result."
            exit 1
          fi
